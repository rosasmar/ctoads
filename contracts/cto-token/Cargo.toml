[package]
name = "cto-token"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true
uint.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
# Only to check that `ctoad_execute` encodes what the account's `execute` expects.
ctoad-account = { path = "../ctoad-account" }
