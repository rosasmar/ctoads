[workspace]
resolver = "2"
members = ["contracts/cto-token", "contracts/ctoad-nft"]

[workspace.dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
uint = { version = "0.10.2", default-features = false }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
